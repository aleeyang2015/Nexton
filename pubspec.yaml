name: next_on
description: "Next On mobile app: Lao HR self-service for attendance, leave and payroll, built feature-first on Riverpod, GoRouter and Dio."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  intl: ^0.20.2
  # UI & Icons
  cupertino_icons: ^1.0.8

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^13.2.4

  # Networking
  dio: ^5.4.3+1
  retrofit: ^4.0.3
  json_annotation: ^4.8.1

  # Utilities
  equatable: ^2.0.5
  freezed_annotation: ^2.4.1

  # Local Storage
  shared_preferences: ^2.2.2
  # Keychain / Keystore backed store for the session tokens (auth.md)
  flutter_secure_storage: ^9.2.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Validation
  form_validator: ^2.1.1
  flutter_svg: ^2.2.3

dev_dependencies:
  flutter_native_splash: ^2.4.7

  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

  # Code Generation
  build_runner: ^2.4.8
  riverpod_generator: ^2.4.0
  freezed: ^2.4.7
  json_serializable: ^6.7.1
  retrofit_generator: ^8.0.4
  hive_generator: ^2.0.1

  # Testing
  mockito: ^5.4.4
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android:
    adaptive_icon_background: "#08123A"
    adaptive_icon_foreground: "assets/images/next_on.png"
    icon: "assets/images/next_on.png"
  ios: true
  image_path: "assets/images/next_on.png"
  remove_alpha_ios: true
  web:
    generate: true
    background_color: "#08123A"
    image_path: "assets/images/next_on.png"

flutter_native_splash:
  color: "#FFFFFF"
  image: assets/images/next_on_splash.png
  android: true
  ios: true
  web: false

  # The following parameter is only for Android 12+ splash screens
  android_12:
    color: "#FFFFFF"
    image: assets/images/next_on_splash.png
    # Control the icon size for Android 12+
    icon_background_color: "#FFFFFF"
    image_dark: assets/images/next_on_splash.png


flutter:
  fonts:
    - family: NotoSansLao
      fonts:
        - asset: assets/fonts/NotoSansLao-Medium.ttf
        - asset: assets/fonts/NotoSansLao-Light.ttf
    - family: roboto
      fonts:
        - asset: assets/fonts/roboto.bold.ttf
        - asset: assets/fonts/roboto.medium.ttf
        - asset: assets/fonts/roboto.medium-italic.ttf
    - family: inter
      fonts:
        - asset: assets/fonts/Inter-Bold.ttf
        - asset: assets/fonts/Inter-Medium.ttf
    - family: OCR-B
      fonts:
        - asset: assets/fonts/OCR-B.ttf

  uses-material-design: true

  assets:
    - assets/svgs/
    - assets/icon/
    - assets/images/
